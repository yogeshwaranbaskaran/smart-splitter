<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />

    <!-- PWA: makes the app installable -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS home-screen support (iOS ignores the manifest's icon/standalone) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Smart Splitter" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Smart Splitter</title>
  </head>
  <body>
    <!-- floating money background (symbols generated by the script below) -->
    <div class="money-bg" aria-hidden="true"></div>
    <div id="root"></div>

    <script>
      // generate the falling money symbols (change COUNT to add/remove)
      (function () {
        var COUNT = 50;
        var symbols = ['₹', '₹', '₹', '₹', '₹', '💵', '💰', '🪙', '💸', '💴', '💶', '💷', '🤑', '💳'];
        var bg = document.querySelector('.money-bg');
        var out = '';
        for (var i = 0; i < COUNT; i++) {
          // even columns + jitter → spread across the width, no clustering/gaps
          var left = (((i + Math.random()) / COUNT) * 100).toFixed(2);
          var size = (1.4 + Math.random() * 1.4).toFixed(2);
          var dur = (26 + Math.random() * 18).toFixed(1);  // slower fall (26–44s)
          var delay = (-Math.random() * dur).toFixed(1); // negative → already mid-fall on load
          var sym = symbols[Math.floor(Math.random() * symbols.length)];
          out += '<span style="left:' + left + '%;font-size:' + size + 'rem;'
               + 'animation-duration:' + dur + 's;animation-delay:' + delay + 's;">' + sym + '</span>';
        }
        bg.innerHTML = out;
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
